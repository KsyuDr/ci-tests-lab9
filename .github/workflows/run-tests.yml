name: Run tests

# Когда запускать: при каждом push и pull request, а также вручную кнопкой в GitHub
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 1. Операционная система виртуальной машины
    runs-on: ubuntu-latest

    steps:
      # 2. Скачать код репозитория на виртуальную машину
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. Установить Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Установить зависимости из requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Запустить тесты
      - name: Run tests with pytest
        run: python -m pytest -v
